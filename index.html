<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="정동진 절벽 위 보리 차실. 함께 앉아 차를 우리고, 진짜 정동진의 일출을 기다려요.">
<meta property="og:title" content="보리 모닝 차실">
<meta property="og:description" content="정동진에서 일출 보며 차 마실 사람 모여라.">
<title>보리 모닝 차실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&family=Poppins:wght@300;400;500&family=Inter:wght@400;500&display=swap">
<style>
html,body{margin:0}*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}
/* Layout: 한 화면 3D 차실 — 마당에서 출입문으로 걸어 들어가 방석에 앉는 구조. 위에 얇은 반투명 HUD. 단일 장면이라 한 가지 톤으로 고정 */
:root{
  --ink:#f3efe6; --ink-mid:rgba(243,239,230,.72); --glass:rgba(22,24,26,.42); --glass-hi:rgba(22,24,26,.62);
  --line:rgba(243,239,230,.22); --sage:#8fa68a; --sage-deep:#5d7a5a; --barley:#c4b07a; --paper:#faf8f4; --text:#2c2b28;
  --f-ko:'Noto Serif KR','Apple SD Gothic Neo','Malgun Gothic',serif;
  --f-brand:'Poppins','Inter',system-ui,sans-serif;
  --f-ui:'Inter','Apple SD Gothic Neo',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:#0d1520;color:var(--ink);font-family:var(--f-ko);font-weight:300;letter-spacing:.03em;-webkit-user-select:none;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;text-shadow:0 1px 10px rgba(0,0,0,.45)}
.logo{font-family:var(--f-brand);font-weight:500;letter-spacing:.2em;font-size:14px}
.status{font-family:var(--f-ui);font-size:12px;letter-spacing:.04em;color:var(--ink-mid);margin-top:6px}
.status b{color:var(--ink);font-weight:500}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:rgba(243,239,230,.4);margin-right:6px;vertical-align:1px}
.dot.on{background:#a9c3a3;box-shadow:0 0 0 4px rgba(169,195,163,.25)}
.time{text-align:right}
.clock{font-family:var(--f-brand);font-weight:300;font-size:clamp(26px,5vw,40px);line-height:1;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.sr{font-family:var(--f-ui);font-size:12px;color:var(--ink-mid);margin-top:6px;letter-spacing:.04em}
.sr b{color:var(--ink);font-weight:500}
.hint{justify-self:center;margin-top:52px;font-size:13px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:7px 14px;text-align:center;transition:opacity .6s}

.bottom{display:grid;gap:10px;justify-items:center}
.bottom > *{pointer-events:auto}
.greets{width:min(560px,100%);display:grid;gap:6px;max-height:24vh;overflow:auto}
.greets:empty{display:none}
.g{display:flex;gap:8px;align-items:baseline;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:14px;padding:7px 12px;font-size:13px;line-height:1.6;min-width:0}
.g b{font-weight:500;white-space:nowrap;font-size:12px;color:var(--barley)}
.g span{min-width:0;overflow-wrap:anywhere}
.sitbtn{font-family:var(--f-ko);font-size:15px;color:var(--text);background:var(--paper);border:0;border-radius:999px;padding:12px 24px;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.3);animation:rise .35s ease-out}
.sitbtn small{font-family:var(--f-brand);font-size:11px;letter-spacing:.2em;color:#5d7a5a;margin-left:8px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{width:min(560px,100%);display:grid;gap:8px;background:var(--glass-hi);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;padding:10px}
.say{display:flex;gap:8px}
.say input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:rgba(243,239,230,.08);border:1px solid var(--line);border-radius:12px;padding:9px 12px;-webkit-user-select:text;user-select:text}
.say input::placeholder{color:rgba(243,239,230,.5)}
.btn{font-family:var(--f-ko);font-size:13px;color:var(--ink);background:rgba(243,239,230,.08);border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:rgba(243,239,230,.16)}
.btn.main{background:var(--sage-deep);border-color:var(--sage-deep);color:var(--paper)}
.btn[aria-pressed="true"]{background:var(--paper);color:var(--text);border-color:var(--paper)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.say input:focus-visible,select:focus-visible,.sitbtn:focus-visible{outline:2px solid var(--barley);outline-offset:2px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.mine{display:flex;gap:10px;align-items:center;justify-content:space-between;font-family:var(--f-ui);font-size:12px;color:var(--ink-mid);flex-wrap:wrap;padding:0 4px}
.teas{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;margin:0 -2px;-webkit-overflow-scrolling:touch}
.teas::-webkit-scrollbar{display:none}
@media (max-width:520px){.teas{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent);padding-right:28px}}
.tea{flex:none;display:flex;align-items:center;gap:6px;font-family:var(--f-ko);font-size:12.5px;color:var(--ink-mid);background:rgba(243,239,230,.06);border:1px solid var(--line);border-radius:999px;padding:6px 11px 6px 8px;cursor:pointer;white-space:nowrap}
.tea i{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.tea[aria-checked="true"]{color:var(--text);background:var(--paper);border-color:var(--paper)}
.tea:focus-visible{outline:2px solid var(--barley);outline-offset:2px}
@media (hover:hover){.tea:hover{border-color:rgba(243,239,230,.5)}}
.mine input{font:inherit;font-size:12px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);padding:3px 2px;width:9em;-webkit-user-select:text;user-select:text}
.mine input::placeholder{color:rgba(243,239,230,.45)}
.brewbar{height:2px;background:rgba(243,239,230,.15);border-radius:2px;overflow:hidden}
.brewbar i{display:block;height:100%;width:0;background:var(--barley);transition:width .5s linear}
.pvrow{display:flex;align-items:center;gap:10px;font-family:var(--f-ui);font-size:12px;color:var(--ink-mid);padding:2px 4px}
.pvrow label{display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
.pvrow input[type=range]{flex:1;min-width:0;accent-color:var(--barley)}
.pvrow b{font-family:var(--f-brand);font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums;min-width:3em;text-align:right}
.bar{touch-action:none;padding-top:4px}
.nogl{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding-inline:max(16px,env(safe-area-inset-left,0px));font-size:15px;line-height:1.9;background:#0d1520;color:var(--ink);z-index:100}
/* computer: a little more room, mouse-friendly sizes */
@media (min-width:1024px) and (pointer:fine){.bar,.greets{width:min(600px,100%)}.clock{font-size:44px}.btn{padding:8px 15px}}
/* tablet */
@media (min-width:700px) and (pointer:coarse){.btn{font-size:14px;padding:10px 16px}.say input{font-size:15px;padding:11px 14px}.sitbtn{font-size:17px;padding:14px 30px}}
/* phone held sideways or any short screen */
@media (max-height:520px){.clock{font-size:24px}.sr,.status{margin-top:2px}.hint{display:none}.greets{max-height:30vh}.side{top:calc(env(safe-area-inset-top,0px) + 54px)}.bar{gap:6px;padding-bottom:8px}}
@media (hover:hover){.sitbtn:hover{filter:brightness(1.05)}}
.bottom{grid-template-columns:minmax(0,1fr);width:100%}
.bar,.greets{min-width:0;max-width:100%;justify-self:center}
.bar > *{min-width:0}
#brewMsg{flex:1 1 12em;min-width:0;overflow-wrap:anywhere}
@media (max-width:480px){.acts{gap:5px}.acts .btn{font-size:12.5px;padding:7px 11px}}
.grab{height:16px;display:flex;align-items:center;justify-content:center;cursor:grab;margin:0 -10px -4px}
.grab i{width:38px;height:4px;border-radius:2px;background:rgba(243,239,230,.38)}
.bottom{will-change:transform}
.kst{font-family:var(--f-brand);font-size:11px;letter-spacing:.2em;margin-left:6px;color:var(--ink-mid);vertical-align:top}
.gate{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding-top:max(14vh,calc(env(safe-area-inset-top,0px) + 24px));padding-bottom:24px;background:rgba(10,14,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding-inline:max(16px,env(safe-area-inset-left,0px))}
.gate-card{width:100%;max-width:360px;min-width:0;margin:0 auto;display:grid;gap:14px;background:var(--glass-hi);border:1px solid var(--line);border-radius:18px;padding:24px;text-align:center}
.gate-card .fine{font-size:11.5px;line-height:1.7;color:rgba(243,239,230,.55)}
.gate-card p{margin:0;word-break:keep-all;font-size:14px;line-height:1.8;color:var(--ink-mid)}
.gate-card input{display:block;width:100%;min-width:0;max-width:100%;font:inherit;font-size:16px;color:var(--ink);background:rgba(243,239,230,.08);border:1px solid var(--line);border-radius:12px;padding:11px 14px;text-align:center;-webkit-user-select:text;user-select:text}
.ver{font-family:var(--f-ui);font-size:9px;letter-spacing:.08em;font-weight:400;color:rgba(243,239,230,.38);margin-left:8px;vertical-align:2px}
.time{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:0}
.sr{max-width:min(62vw,340px)}
.homebtn{pointer-events:auto;background:var(--glass);font-size:12px;padding:6px 12px;text-shadow:none}
body.cha .homebtn{opacity:0;pointer-events:none}
#brewMsg.ding{animation:ding 1.6s ease-out}
@keyframes ding{0%{color:var(--paper);text-shadow:0 0 12px rgba(196,176,122,.9)}100%{color:inherit;text-shadow:none}}
.solo{font-family:var(--f-ui);font-size:11px;color:var(--ink-mid);text-align:center}

.labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;text-align:center;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.tag .n{font-size:12px;font-weight:400}
.tag .n.me{color:var(--barley)}
.tag .s{font-family:var(--f-ui);font-size:10px;color:var(--ink-mid);letter-spacing:.03em}
.bubble{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);background:var(--paper);color:var(--text);font-size:12px;line-height:1.55;padding:7px 11px;border-radius:12px;white-space:normal;width:max-content;max-width:180px;text-shadow:none;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.bubble::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--paper)}
.joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:1px solid rgba(243,239,230,.35);background:rgba(243,239,230,.06);pointer-events:none}
.joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(243,239,230,.55)}
.side{position:fixed;top:calc(env(safe-area-inset-top,0px) + 74px);display:flex;gap:6px;align-items:center}
.side.l{left:max(16px,env(safe-area-inset-left,0px))}
.side.r{right:max(16px,env(safe-area-inset-right,0px))}
.side .btn,.preview{background:var(--glass);font-size:12px;padding:6px 12px}
.preview{font-family:var(--f-ui);color:var(--ink-mid);display:flex;align-items:center;gap:6px;border-radius:999px}
.preview input[type=range]{width:90px;accent-color:var(--barley)}
.breath{position:fixed;left:0;right:0;top:40%;text-align:center;font-size:16px;letter-spacing:.35em;opacity:0;transition:opacity 1.6s;pointer-events:none;text-shadow:0 1px 12px rgba(0,0,0,.5)}
body.cha .breath{opacity:.9}
.greets,.say,.mine,.labels,.side,.hint{transition:opacity 1.2s}
body.cha .greets,body.cha .say,body.cha .mine,body.cha .labels,body.cha .side,body.cha .hint,body.cha .pvrow{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.brewbar i{transition:none}.sitbtn{animation:none}}
</style>

</head>
<body>
<canvas id="gl" aria-label="정동진 절벽 위 보리 차실. 마당에서 출입문으로 걸어 들어가 빈 방석에 앉아요."></canvas>
<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gateForm">
    <div class="logo">BORIH MORNING</div>
    <p>정동진 보리 차실에 오신 걸 환영해요.<br>차실에서 불릴 이름을 알려주세요.</p>
    <p class="fine">이름과 걷는 모습, 남긴 메시지는 지금 차실에 있는 모든 분에게 보여요.<br>창을 닫으면 차실에서 나가요.</p>
    <input id="nick" maxlength="12" autocomplete="nickname" placeholder="예: 보리" aria-label="이름">
    <button class="btn main" type="submit">차실로 들어가기</button>
  </form>
</div>
<div class="labels" id="labels"></div>
<div class="joy" id="joy" hidden><i id="knob"></i></div>
<div class="breath" id="breath">들이쉬고</div>

<div class="hud">
  <div style="display:grid">
    <div class="top">
      <div><div class="logo">BORIH MORNING<span class="ver" id="ver"></span></div><div class="status" id="status"><span class="dot"></span>차실을 여는 중</div></div>
      <div class="time"><div class="clock" id="clock">--:--</div><div class="sr" id="sr">정동진 일출 <b>--:--</b></div><button class="btn homebtn" id="home">시점 되돌리기</button></div>
    </div>
    <div class="hint" id="hint">화면을 끌어 걸어보세요 · 출입문으로 들어가요</div>
  </div>
  <div class="bottom">
    <div class="greets" id="greets" aria-live="polite"></div>
    <button class="sitbtn" id="sitBtn" hidden>여기 앉기<small id="sitNo"></small></button>
    <div class="bar" id="bar">
      <div class="grab" aria-hidden="true"><i></i></div>
      <form class="say" id="say"><input id="greet" maxlength="60" autocomplete="off" placeholder="메시지 남기기"><button class="btn main" type="submit">남기기</button></form>
      <div class="acts">
        <button class="btn" id="bow">인사</button>
        <button class="btn main" id="brewBtn" hidden>차 우리기</button>
        <button class="btn main" id="pourBtn" hidden disabled>보듬이에 따르기</button>
        <button class="btn" id="sip" disabled>한 모금</button>
        <button class="btn" id="cha" aria-pressed="false" disabled>차멍</button>
        <button class="btn" id="stand" hidden>일어나기</button>
        <button class="btn" id="waves" aria-pressed="false">명상 음악</button>
      </div>
      <div class="mine"><span id="brewMsg">마당에 도착했어요</span></div>
      <div class="teas" id="tea" role="radiogroup" aria-label="오늘의 차"></div>
      <div class="brewbar"><i id="brewbar"></i></div>
      <div class="pvrow"><label><input type="checkbox" id="pvOn"> 하루 미리보기</label><input type="range" id="pv" min="0" max="100" value="8" aria-label="미리보기 시각"><b id="pvT">--:--</b></div>
      <div class="solo" id="solo" hidden>지금은 차실에 연결하지 못해 혼자 보는 화면이에요. 잠시 뒤 다시 들어와 주세요.</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>')</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"><\/script>')</script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const notice=t=>{document.body.insertAdjacentHTML('beforeend','<div class="nogl">'+t+'</div>')};
if(!window.THREE){notice('3D 차실을 불러오지 못했어요.<br>잠시 뒤 새로고침해 주세요.');return}
// one page for phone, tablet and computer: touch drag or mouse drag or arrow keys to walk; lighter rendering on small touch devices
const TOUCH=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
const LOW=TOUCH&&Math.min(screen.width,screen.height)<600;
document.documentElement.dataset.input=TOUCH?'touch':'mouse';
(()=>{let ok=false;try{const c=document.createElement('canvas');ok=!!(window.WebGLRenderingContext&&(c.getContext('webgl')||c.getContext('experimental-webgl')))}catch(e){}
  if(!ok){document.body.insertAdjacentHTML('beforeend','<div class="nogl">이 기기나 브라우저에서는 3D 차실을 열 수 없어요.<br>최신 Chrome, Safari, Edge에서 다시 열어주세요.</div>');throw new Error('no webgl')}})();
document.addEventListener('dblclick',e=>{if(e.target.id==='gl')e.preventDefault()});
const LAT=37.6907,LON=129.0336,R=Math.PI/180,H9=9*3600e3;
// liquor colours: 발효차 amber, 녹차 pale yellow-green, 백차 pale gold, 우롱 golden, 보이차 deep reddish-brown, 홍차 warm reddish-brown
const TEAS=[{k:'green',n:'녹차',c:'#a7b04e'},{k:'white',n:'백차',c:'#d8c27c'},{k:'oolong',n:'우롱',c:'#c68a2c'},{k:'puer',n:'보이차',c:'#4e2214'},{k:'black',n:'홍차',c:'#8f5428'}];
const ROBES=['#8fa68a','#c4b07a','#8c7b6b','#7a9e9a','#bccdb7','#a89860','#9e9b8c','#d4cfc6','#6b8a68','#b39b7d','#86a3a0','#e8dfc8'];
/* ===== settings ===== */
const PLACE='정동진';                                   // this tea room
const OPEN_END=Date.UTC(2026,10,16,15,0);               // 2026-11-17 00:00 KST: the room closes and points to the next sunrise spot
const NEXT_PLACE='';                                    // e.g. '호미곶' once decided
const NEXT_URL='';                                      // e.g. 'https://borih-official.github.io/homigot/'
const SPEED=1.35;
const WALL_Z=4.9,DOOR_HALF=.85,ROOM_X=7.6,YARD_Z=22,YARD_X=9,GROUND=-.18;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem('bm.'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('bm.'+k,JSON.stringify(v))}catch(e){}}};
const angLerp=(a,b,f)=>{let d=((b-a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;return a+d*f};

/* ===== sun ===== */
function sun(t){
  const n=t/864e5+2440587.5-2451545;
  const L=(280.46+0.9856474*n)%360,g=((357.528+0.9856003*n)%360)*R;
  const lam=(L+1.915*Math.sin(g)+0.02*Math.sin(2*g))*R,eps=(23.439-4e-7*n)*R;
  const ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)),dec=Math.asin(Math.sin(eps)*Math.sin(lam));
  let gm=(18.697374558+24.06570982441908*n)%24;if(gm<0)gm+=24;
  const h=(gm*15+LON)*R-ra,la=LAT*R;

/* ===== input: drag to walk, drag to look while seated, pinch or wheel to zoom ===== */

    else{camT.th-=(e.clientX-p.x)*.0065;camT.el=clamp(camT.el+(e.clientY-p.y)*.0045,.05,1.2)}}
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2&&pinch0){const [a,b]=[...ptrs.values()];camT.r=clamp(pinch0.r*pinch0.d/Math.max(20,Math.hypot(a.x-b.x,a.y-b.y)),2.2,16)}});

addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;

function inputVec(){
  let x=0,y=0;if(joy){x=joy.dx;y=joy.dy}
  if(keys.has('arrowleft')||keys.has('a'))x-=1;if(keys.has('arrowright')||keys.has('d'))x+=1;
  if(keys.has('arrowup')||keys.has('w'))y-=1;if(keys.has('arrowdown')||keys.has('s'))y+=1;
  const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}return {x,y,m:Math.min(1,m)};

/* ===== walking, with walls and one door ===== */
let movedAt=0;
function moveMe(dt){
  if(me.mode!=='walk'){me.char.speed=0;return}
  const iv=inputVec();
  if(iv.m<.08){me.char.speed*=.8;return}
  // directions stay fixed to how the view looked when the finger went down, so turning never feeds back into itself
  const th=joy?joy.th:camS.th,fx=-Math.sin(th),fz=-Math.cos(th),rx=Math.cos(th),rz=-Math.sin(th);
  let mx=rx*iv.x-fx*iv.y,mz=rz*iv.x-fz*iv.y;const ml=Math.hypot(mx,mz)||1;mx/=ml;mz/=ml;
  const g=clamp((iv.m-.08)/.92,0,1),sp=SPEED*g*g*(inside(me.x,me.z)?1:1.35);/* a little brisker in the yard */
  let nx=me.x+mx*sp*dt,nz=me.z+mz*sp*dt;
  const inDoor=Math.abs(nx)<DOOR_HALF-.22;
  if(inside(me.x,me.z)!==inside(nx,nz)&&!inDoor){nz=me.z;if(Math.abs(nx)<2.2)nx-=Math.sign(nx)*Math.min(Math.abs(nx),dt*1.6)}
  else if(!inDoor&&Math.abs(nz-WALL_Z)<.45&&Math.abs(nx)<2.2&&Math.abs(mz)>.5)nx-=Math.sign(nx)*Math.min(Math.abs(nx),dt*1.2);
  if(inside(nx,nz)){nx=clamp(nx,-ROOM_X,ROOM_X);nz=Math.max(nz,-4.55);if(!inDoor)nz=Math.min(nz,WALL_Z-.3)}
  else{nx=clamp(nx,-YARD_X,YARD_X);nz=Math.min(nz,YARD_Z);if(!inDoor)nz=Math.max(nz,WALL_Z+.3)}
  me.x=nx;me.z=nz;me.ry=angLerp(me.ry,Math.atan2(-mx,-mz),Math.min(1,dt*5));me.char.speed=sp;
  if(!joy)camT.th=angLerp(camT.th,me.ry,Math.min(1,dt*.8));
  movedAt=performance.now();
}

/* ===== seats ===== */
function seatOwner(i){

  let best=null;for(const [peer,o] of others){if(o.pr.mode==='sit'&&o.pr.seat===i){const t=o.pr.seatAt||9e15;if(!best||t<best.t||t===best.t&&peer<best.peer)best={peer,t,pr:o.pr,char:o.char}}}
  return best;
}
function updateRows(dt){
  let lastRow=-1;for(let i=0;i<seatPos.length;i++)if(seatOwner(i))lastRow=Math.max(lastRow,Math.floor(i/PER_ROW));
  let want=Math.max(MIN_ROWS,lastRow+1),full=true;
  for(let i=0;i<want*PER_ROW;i++)if(realSeat(i)&&!seatOwner(i)){full=false;break}
  if(full)want++;
  const n=Math.min(ROW_Z.length,want);if(n!==rowsShown){rowsShown=n;nearSeat=-1}
  seats.forEach((st,i)=>{const tgt=Math.floor(i/PER_ROW)<rowsShown&&realSeat(i)?1:.001,sc=st.g.scale.x+(tgt-st.g.scale.x)*Math.min(1,dt*3);st.g.scale.setScalar(sc);st.g.visible=sc>.02});
}

  let bi=null,bd=.95;seatPos.forEach((p,i)=>{if(i>=rowsShown*PER_ROW||!realSeat(i))return;const d=Math.hypot(me.x-p.x,me.z-(p.z+.15));if(d<bd&&!seatOwner(i)){bd=d;bi=i}});return bi;
}

}
$('sitBtn').onclick=()=>{if(nearSeat!=null)sitAt(nearSeat)};

/* ===== tea: 물 → 다관 → 숙우 (by itself), 숙우 → 보듬이 (button, three cups per infusion) ===== */
const teaOf=k=>TEAS.find(t=>t.k===k)||TEAS[0];
// infusion times in seconds, no rinse. Green, white, black and oolong follow the gongfu guide (10→15→20→30→45, then a minute each);

  const k=me.act;me.act=null;

  if(k==='tb2tp'){me.steep++;me.brew='steep';timer(steepTime(me.tea,me.steep))}
  else if(k==='tp2sk'){me.sk=3;me.brew='ready';timer(0)}

}
setInterval(()=>{

  }

$('brewBtn').onclick=()=>{if(me.mode==='sit'&&me.brew==='idle'&&!me.act)startAct(me.steep===0?'cd2tp':'tb2tp')};   // new leaves for a fresh pot, then water
$('pourBtn').onclick=()=>{if(me.mode==='sit'&&me.sk>0&&!me.act)startAct('sk2bd')};
$('tea').onclick=e=>{const b=e.target.closest('.tea');if(!b||b.dataset.k===me.tea)return;me.tea=b.dataset.k;store.set('tea2',me.tea);renderTeas();if(me.mode==='sit')startBrew();else presence()};

/* ===== presence ===== */
function presence(){if(!room)return;room.presence({away:document.hidden?1:0,name:me.name,color:me.color,bowl:me.bowl,x:+me.x.toFixed(2),z:+me.z.toFixed(2),ry:+me.ry.toFixed(2),mode:me.mode,seat:me.seat,
  tea:me.tea,greet:me.greet.slice(0,60),greetAt:me.greetAt,seatAt:me.seatAt||0,brew:me.brew,steep:me.steep,sips:me.sips,cup:+(me.cup||0).toFixed(2),sk:me.sk,drink:me.drink,act:me.act,actAt:me.actAt,emote:me.emote,emoteAt:me.emoteAt}).catch(()=>{})}

let sipHintShown=false;
function sipped(){
  if(!sipHintShown){sipHintShown=true;const h=$('hint');h.textContent='보듬이를 들고 있으면 천천히 저절로 마셔요 · 한 모금 버튼으로 더 마실 수도 있어요';h.style.opacity=1;setTimeout(()=>{if(me.mode==='sit')h.style.opacity=0},9000)}me.sips++;setSprout(me.char,me.sips);

  presenceSoon()}

$('bow').onclick=()=>emote('bow');$('sip').onclick=()=>emote('sip');

const ACTS=['cd2tp','tb2tp','tp2sk','sk2bd'],BREWS=['idle','steep','ready'],HEX=/^#[0-9a-f]{6}$/i;
const cleanText=(t,n)=>typeof t==='string'?t.replace(/https?:\/\/\S+|www\.\S+/gi,'').replace(/[\u0000-\u001f\u200b-\u200f\u202a-\u202e]/g,'').slice(0,n):'';
const int=(v,a,b,d=0)=>Number.isInteger(+v)&&+v>=a&&+v<=b?+v:d,numIn=(v,a,b,d=0)=>Number.isFinite(+v)?clamp(+v,a,b):d;

  return {x:numIn(r.x,-30,30),z:numIn(r.z,-6,30,15),ry:numIn(r.ry,-50,50),mode,seat:mode==='sit'?seat:null,seatAt:numIn(r.seatAt,0,9e15),

    steep:int(r.steep,0,99),sk:int(r.sk,0,3),cup:numIn(r.cup,0,1),drink:!!r.drink&&mode==='sit',sips:int(r.sips,0,100000),
    emote:r.emote==='bow'||r.emote==='sip'?r.emote:null,emoteAt:numIn(r.emoteAt,0,9e15),greet:cleanText(r.greet,60),greetAt:numIn(r.greetAt,0,9e15),away:r.away?1:0}}
function syncPeers(list){
  const seen=new Set();

    const raw=p.presence||{};if(typeof raw.x!=='number'||typeof raw.z!=='number')continue;const pr=sanitize(raw);
    seen.add(p.peer);let o=others.get(p.peer);
    if(!o){o={char:makeChar(pr.color||ROBES[others.size%ROBES.length]),x:pr.x,z:pr.z,ry:+pr.ry||0,pr,by:p.by,fresh:true};others.set(p.peer,o)}
    if(pr.emoteAt&&pr.emoteAt!==o.pr.emoteAt&&!o.fresh)emotes.set(p.peer,{k:pr.emote,at:performance.now()});
    if(pr.greet&&pr.greetAt&&pr.greetAt!==o.pr.greetAt&&o.lastGreet&&performance.now()-o.lastGreet<5000){pr.greet=o.pr.greet;pr.greetAt=o.pr.greetAt}

/* ===== name tags and greetings ===== */
const labelsEl=$('labels'),tags={};

const nameOfOther=o=>{const n=typeof o.pr.name==='string'?o.pr.name.trim().slice(0,12):'';return n||'이삭님'};

function renderTags(){

function wavUrl(out,n,SR){
  const bytes=44+n*4,ab=new ArrayBuffer(bytes),v=new DataView(ab);const w=(o,str)=>{for(let k=0;k<str.length;k++)v.setUint8(o+k,str.charCodeAt(k))};

function connectRoom(){

  // 'st' = my whole state (on change, at most once a second, plus a 4 s heartbeat), 'pos' = footsteps (≤4 a second).
  return new Promise(res=>{

      for(const k in peers){const p=peers[k],away=p.st&&p.st.away;

        const keep=away?30*60e3:h.has(k)?60e3:15000;if(now-p.seen>keep||(p.leftAt&&now-p.leftAt>180e3)){delete peers[k];continue}

      return out};
    const emit=j=>{if(cb)cb({peers:peersNow(),joined:j?[1]:[]})};
    const peer=k=>peers[k]||(peers[k]={seen:Date.now()});

    const budget={},allow=(k,kind,per)=>{const now=performance.now(),b=budget[k+kind]||(budget[k+kind]={t:now,n:0});if(now-b.t>1000){b.t=now;b.n=0}return ++b.n<=per};

    ch.on('broadcast',{event:'bye'},({payload:p})=>{if(p&&typeof p.k==='string'&&p.k!==myKey){delete peers[p.k];emit(false)}});
    ch.on('broadcast',{event:'pos'},({payload:p})=>{if(!p||typeof p.k!=='string'||p.k.length>40||p.k===myKey||!peers[p.k]||!allow(p.k,'p',20))return;
